<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Engineering 教學型互動 HTML 簡報</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2314213d'/><text x='16' y='21' text-anchor='middle' font-size='14' font-weight='bold' fill='white' font-family='sans-serif'>CE</text></svg>">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="stylesheet" href="./assets/slides.css">
</head>
<body data-active-slide="1">
  <div class="slide-shell">
    <header class="slide-topbar">
      <div class="slide-topbar-left">
        <a class="brand" href="./index.html">
          <span class="brand-mark">CE</span>
          <span>Context Engineering 教學簡報</span>
        </a>
        <span class="slide-unit-badge" id="slide-unit-badge">Unit 1</span>
      </div>
      <div class="slide-topbar-right">
        <button class="btn btn-sm" id="btn-overview" title="快捷鍵 G">總覽 (G)</button>
        <button class="btn btn-sm" id="btn-notes" title="快捷鍵 S">講者備忘 (S)</button>
        <button class="btn btn-sm" id="btn-mode-toggle">捲動閱讀模式</button>
        <a class="btn btn-sm" href="./wiki.html">Wiki 知識庫</a>
        <a class="btn btn-sm" href="./workflow.html">流程與反思</a>
      </div>
    </header>

    <div class="slide-progress-track">
      <div class="slide-progress-fill" id="slide-progress-fill" style="width: 7%;"></div>
    </div>

    <main class="slide-stage" id="slide-stage" aria-live="polite">
      <article class="slide-card" id="slide-card"></article>
    </main>

    <footer class="slide-bottombar">
      <div class="provenance-strip" id="provenance-strip">
        <span class="provenance-label">本頁知識溯源（點擊查看 Wiki）：</span>
      </div>
      <div class="slide-nav-btns">
        <button class="btn btn-sm" id="btn-prev">← 上一頁</button>
        <span id="slide-counter" style="font-family:var(--font-mono);font-size:0.86rem;font-weight:700;min-width:54px;text-align:center;">1 / 14</span>
        <button class="btn btn-sm btn-primary" id="btn-next">下一頁 →</button>
      </div>
    </footer>
  </div>

  <div class="notes-bar" id="notes-bar">
    <strong>講者白話備忘錄：</strong>
    <span id="notes-text"></span>
  </div>

  <div class="overview-modal" id="overview-modal" aria-hidden="true">
    <div style="max-width:1120px;margin:0 auto 0.75rem;display:flex;justify-content:space-between;align-items:center;">
      <strong style="color:#fff;font-size:1.1rem;">全部投影片總覽（點選直接跳頁，按 Esc 關閉）</strong>
      <button class="btn btn-sm" id="btn-close-overview">關閉總覽</button>
    </div>
    <div class="overview-grid" id="overview-grid"></div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="wiki-drawer" id="wiki-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <div style="font-size:0.75rem;font-weight:700;color:var(--accent-teal);text-transform:uppercase;">LLM Wiki 溯源檢查抽屜</div>
        <strong id="wiki-drawer-title" style="font-size:1.05rem;color:var(--ink-primary);">載入中...</strong>
      </div>
      <div style="display:flex;gap:0.45rem;">
        <a class="btn btn-sm btn-teal" id="wiki-drawer-open-full" href="./wiki.html">在完整 Wiki 開啟</a>
        <button class="btn btn-sm" id="wiki-drawer-close">✕ 關閉</button>
      </div>
    </div>
    <div class="drawer-body wiki-article" id="wiki-drawer-body"></div>
  </aside>

  <script src="./assets/wiki-data.js"></script>
  <script src="./assets/slides-app.js"></script>
</body>
</html>
